[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgi"
version = "0.1.0"
description = "Social goal inference pipeline (CS6244 project)"
requires-python = ">=3.12"
dependencies = ["numpy", "pillow>=10.1", "matplotlib>=3.8", "pyyaml", "pydantic>=2.12.5,<3", "google-genai>=2.28.0,<3", "openai>=3.26.0,<4", "anthropic>=1.13.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
