# Default configuration. Every stage uses the mock entry, so it runs without API keys.
# Model IDs change over time: confirm each with
# `python -m sgi.smoke --model <entry>` before using it for a reported number.
models:
  mock:            {provider: mock, model: mock-centre}
  gemini_fast:     {provider: gemini, model: gemini-3.8-flash, reasoning_effort: low, point_format: xy_1000}
  gemini_strong:   {provider: gemini, model: gemini-3.1-pro-preview, reasoning_effort: low, point_format: xy_1000}
  # Answered on 2026-10-21 while gemini-3.8-flash gave 503 (high demand). point_format not calibrated.
  gemini_35_flash: {provider: gemini, model: gemini-3.5-flash, reasoning_effort: low, point_format: xy_1000}
  gemini_pointing: {provider: gemini, model: gemini-robotics-er-2-preview, reasoning_effort: low, point_format: xy_1000}
  gemini3_flash:       {provider: gemini, model: gemini-3-flash-preview, reasoning_effort: low, point_format: xy_1000}
  gemini31_flash_lite: {provider: gemini, model: gemini-3.1-flash-lite, reasoning_effort: low, point_format: xy_1000}
  gemini35_flash_lite: {provider: gemini, model: gemini-3.5-flash-lite, reasoning_effort: low, point_format: xy_1000}
  gemini36_flash:      {provider: gemini, model: gemini-3.6-flash, reasoning_effort: low, point_format: xy_1000}
  openai_fast:     {provider: openai, model: gpt-6-luna, reasoning_effort: low, point_format: xy_1000}
  openai_strong:   {provider: openai, model: gpt-6.1-sol, reasoning_effort: low, point_format: xy_1000}
  # SoCLaaS, the school's gateway to open-weight models, in the OpenAI chat-completions format: one entry per
  # vision model and thinking level worth comparing.
  # The ids qwen3.6:27b and ornith1.0:35b have no entry: the gateway's model list marks them as aliases of
  # qwen3.8:27b and of ornith1.5:35b.
  # reasoning_effort is always sent: left out, it means maximum thinking on some models and none on others.
  # The levels each model accepts, from one call per model and level:
  #   qwen3.8:27b                none, low, medium, xhigh; minimal, high and max are rejected
  #   qwen3.6:35b                any name; none is off, every other name thinks, in no clear order
  #   ornith1.5:35b              any name; none is off, every other name thinks, in no reliable order
  #   x-test-1 (GLM-5.3-Flash)   none, low, high, max, in rising amount of thinking; any other name means max
  #   qwen3.5:9b                 none, low, medium, high, max, but with thinking it ran to the token limit
  #                              and gave no answer; minimal and xhigh are rejected
  #   gemma4:26b                 none only: every thinking level ended in a 502 after 60 s
  #   x-test-3                   none and low tried (low thinks); the others not tried
  #   qwen3-vl:32b               any name, and it never thinks
  # max_requests_per_minute: the pace for this service. Everything that uses the key shares
  # that, and runs started side by side each pace themselves: run them one after another, or lower the number.
  # price_*_per_mtok: US dollars per million tokens, from the gateway's model list; thinking is billed as output.
  soclaas_qwen38:        {<<: &soclaas {provider: openai_compatible, base_url: "https://soclaas-api.comp.nus.edu.sg/v1",
                                        api_key_env: SOCLAAS_API_KEY, point_format: xy_1000, structured_output: json_schema,
                                        max_requests_per_minute: 80},
                          model: "qwen3.8:27b", reasoning_effort: "none",
                          price_input_per_mtok: 0.408922, price_output_per_mtok: 2.320054}
  soclaas_qwen38_low:    {<<: *soclaas, model: "qwen3.8:27b", reasoning_effort: low,
                          price_input_per_mtok: 0.408922, price_output_per_mtok: 2.320054}
  soclaas_qwen38_medium: {<<: *soclaas, model: "qwen3.8:27b", reasoning_effort: medium,
                          price_input_per_mtok: 0.408922, price_output_per_mtok: 2.320054}
  soclaas_qwen36_35:     {<<: *soclaas, model: "qwen3.6:35b", reasoning_effort: "none",
                          price_input_per_mtok: 0.450056, price_output_per_mtok: 1.5155}
  soclaas_qwen3vl:       {<<: *soclaas, model: "qwen3-vl:32b", reasoning_effort: "none",
                          price_input_per_mtok: 0.380025, price_output_per_mtok: 2.419278}
  soclaas_ornith15:      {<<: *soclaas, model: "ornith1.5:35b", reasoning_effort: "none",
                          price_input_per_mtok: 0.2, price_output_per_mtok: 1.7}
  soclaas_ornith15_low:  {<<: *soclaas, model: "ornith1.5:35b", reasoning_effort: low,
                          price_input_per_mtok: 0.2, price_output_per_mtok: 1.7}
  soclaas_glm53:         {<<: *soclaas, model: x-test-1, reasoning_effort: "none",
                          price_input_per_mtok: 0.37, price_output_per_mtok: 1.25,
                          timeout_s: 600}   # 7 Nov 2026: GLM's gateway answers took a median 132 s; 180 s dropped its slower answers
  soclaas_glm53_low:     {<<: *soclaas, model: x-test-1, reasoning_effort: low,
                          price_input_per_mtok: 0.37, price_output_per_mtok: 1.25}
  soclaas_glm53_high:    {<<: *soclaas, model: x-test-1, reasoning_effort: high,
                          price_input_per_mtok: 0.37, price_output_per_mtok: 1.25}
  soclaas_glm53_max:     {<<: *soclaas, model: x-test-1, reasoning_effort: max,
                          price_input_per_mtok: 0.37, price_output_per_mtok: 1.25}
  soclaas_dsv41:         {<<: *soclaas, model: x-test-2, reasoning_effort: "none",     # DeepSeek V4.1 Flash 1017
                          price_input_per_mtok: 0.3, price_output_per_mtok: 1.2}
  soclaas_dsv41_low:     {<<: *soclaas, model: x-test-2, reasoning_effort: low,        # its levels: none, low, high, xhigh, max
                          price_input_per_mtok: 0.3, price_output_per_mtok: 1.2}
  # x-test-3: Qwen 3.8 Flash Next (served as qwen3.8-flash-next).
  # sgi.smoke --calibrate: median error 42.8 px in xy_1000 against 301.3 px in xy_pixel (the image centre:
  # 179.8 px).
  soclaas_qwen38_next:     {<<: *soclaas, model: x-test-3, reasoning_effort: "none"}
  soclaas_qwen38_next_low: {<<: *soclaas, model: x-test-3, reasoning_effort: low}
  soclaas_gemma4:        {<<: *soclaas, model: "gemma4:26b", reasoning_effort: "none",
                          price_input_per_mtok: 0.102294, price_output_per_mtok: 0.379882}
  soclaas_qwen35_9:      {<<: *soclaas, model: "qwen3.5:9b", reasoning_effort: "none",
                          price_input_per_mtok: 0.114438, price_output_per_mtok: 0.200438}
  # Claude, through Anthropic's own API. Run `python -m sgi.smoke --model <entry>` before an entry's first use.
  # reasoning_effort is the model's effort level: low, medium, high, xhigh, max. Left out of a request it is
  # medium on Opus 5.5 and on Haiku 5.5 and high on Sonnet 5.5, so it is always sent. The models think by
  # themselves, as much as the level allows, and no thinking setting is sent with a level.
  # "none" is not a level of theirs: it stands here for thinking switched off, and no level is sent with it.
  # Haiku 5.5 takes that; Opus 5.5 and Sonnet 5.5 cannot switch thinking off and refuse the request.
  # No entry may set temperature or image_detail: the models refuse a sampling parameter, and none is sent.
  # price_*_per_mtok: US dollars per million tokens, from Anthropic's model table as it stood on 2026-10-06;
  # thinking is billed as output. Haiku's are for a prompt of up to 100 000 tokens (0.50 and 2.50 above that).
  # point_format, by `python -m sgi.smoke --model <entry> --calibrate`: Sonnet and Haiku point in pixels. On 17 October
  # Haiku's median error was 37 px in xy_pixel against 117 px in xy_1000 and Sonnet's 43 against 44 px; on 21 October
  # Haiku's again 38.6 against 104.6 px (the image centre: 179.8 px). Opus is not calibrated and keeps xy_1000.
  claude_opus55:       {provider: anthropic, model: claude-opus-5-5, reasoning_effort: medium, point_format: xy_1000,
                        price_input_per_mtok: 4.0, price_output_per_mtok: 20.0}
  claude_opus55_low:   {provider: anthropic, model: claude-opus-5-5, reasoning_effort: low, point_format: xy_1000,
                        price_input_per_mtok: 4.0, price_output_per_mtok: 20.0}
  claude_sonnet55:     {provider: anthropic, model: claude-sonnet-5-5, reasoning_effort: medium, point_format: xy_pixel,
                        price_input_per_mtok: 2.0, price_output_per_mtok: 10.0}
  claude_sonnet55_low: {provider: anthropic, model: claude-sonnet-5-5, reasoning_effort: low, point_format: xy_pixel,
                        price_input_per_mtok: 2.0, price_output_per_mtok: 10.0}
  claude_haiku55:      {provider: anthropic, model: claude-haiku-5-5, reasoning_effort: "none", point_format: xy_pixel,
                        price_input_per_mtok: 0.1, price_output_per_mtok: 0.5}
  claude_haiku55_low:  {provider: anthropic, model: claude-haiku-5-5, reasoning_effort: low, point_format: xy_pixel,
                        price_input_per_mtok: 0.1, price_output_per_mtok: 0.5}
  # Older models; point formats calibrated with sgi.smoke --calibrate on the real
  # set: Haiku 4.5 answers in 0-1000, Sonnet 4.6 and 5 in pixels, the Gemini models in 0-1000.
  claude_haiku45:      {provider: anthropic, model: claude-haiku-4-5, reasoning_effort: "none", point_format: xy_1000,
                        price_input_per_mtok: 1.0, price_output_per_mtok: 5.0, max_requests_per_minute: 25}
  claude_sonnet46_low: {provider: anthropic, model: claude-sonnet-4-6, reasoning_effort: low, point_format: xy_pixel,
                        price_input_per_mtok: 3.0, price_output_per_mtok: 15.0, max_requests_per_minute: 25}
  claude_sonnet5_low:  {provider: anthropic, model: claude-sonnet-5, reasoning_effort: low, point_format: xy_pixel,
                        price_input_per_mtok: 2.0, price_output_per_mtok: 10.0, max_requests_per_minute: 25}
stages:            # model: a key of models. strategy: zero_shot | cot, and for goal also few_shot | few_shot_cot
  plan:    {model: mock, strategy: cot}
  locate:  {model: mock, strategy: zero_shot}
  context: {model: mock, strategy: zero_shot}
  goal:    {model: mock, strategy: few_shot}
  # people and constraints, the two stages that goal: constraints adds, may be named here in the same way. Left
  # out, each uses the model entry of the goal stage, people with zero_shot and constraints with cot.
run:
  grounding: vlm               # vlm | oracle
  context_check: vlm           # vlm | oracle | always_yes | always_no
  goal: direct_marking         # direct_marking | oracle | constraints (people, constraints and a solver)
  people: vlm                  # vlm | oracle: under goal: constraints, who finds the people
  constraints: vlm             # vlm | none: under goal: constraints, who states the constraints; none: the solver alone
  grounding_source: view       # view | tour
  heading_mode: face_target    # face_target | vlm_look_at
  trials: 1
  examples_dir: data/placeholder/examples
thresholds:        # metres and radians; the two *_deg in degrees. The last ten are the constraint method's.
  {standoff_m: 1.0, standard_goal_max_slide_m: 0.5, standard_goal_step_m: 0.05, standard_goal_clearance_m: 0.40,
   surface_radius_m: 0.30, surface_min_points: 40, surface_min_spread_m: 0.05, surface_max_tilt: 0.5,
   surface_max_rms_m: 0.06, surface_max_rms_ratio: 0.5,
   floor_tolerance_m: 0.15, lift_window: 5, heading_degenerate_m: 0.05,
   robot_radius_m: 0.30, person_radius_m: 0.25, grid_resolution_m: 0.05,
   match_tolerance_m: 0.3, default_match_radius_m: 0.75, personal_gap_m: 0.3,
   anchor_depth_tolerance_m: 0.3, relevant_radius_m: 2.0, visibility_depth_tolerance_m: 0.3, visibility_min_samples: 3,
   floor_depth_max_rel_error: 0.02, floor_min_pixels: 2000, floor_person_clearance_m: 0.4,
   camera_height_min_m: 0.2, camera_height_max_m: 3.0, yaw_tolerance_rad: 0.001, free_space_agreement_min: 0.90,
   view_half_angle_deg: 35.0, visible_half_angle_deg: 60.0, floor_range_m: 12.0,
   seen_depth_ratio: 0.03, seen_depth_margin_m: 0.02, max_keep_m: 3.0, max_people: 40, max_constraints: 12,
   person_mark_height_m: 1.1, candidate_count: 4, join_facing_deg: null, join_spacing_ratio: null}
dev_situations: [no_one, waiting_line, conversation_group, audience]
held_out_situations: [group_photo, lift_wait, machine_use]
