# cafe_line2: 2 waiting at the counter. One of a set of three
# (cafe_line0, _line2, _line6) that differ only in how many wait, in the simple café (python -m sgi_habitat.make_cafe).
# Spot starts east of the line, looking across it: the counter and all six places of the line are in view
# (checked against depth). The line stands still, nobody being served; two people walk about
# beyond it, where they never come between Spot and the line.
stage: data/habitat/stages/cafe.glb
wander_area: [0.5, 4.0, -7.5, -1.5]

robot:
  x: 8.0
  y: -2.6
  face: [5.0, -2.95]

queues:
  counter_line:
    service_s: null
    slots:
      - {x: 5.0, y: -1.45, face: [5.0, -0.5]}
      - {x: 5.0, y: -2.15}
      - {x: 5.0, y: -2.85}
      - {x: 5.0, y: -3.55}
      - {x: 5.0, y: -4.25}
      - {x: 5.0, y: -4.95}

humans:
  - {avatar: male_1, queue: counter_line}
  - {avatar: female_0, queue: counter_line}
  - {avatar: male_3, start: [2.0, -6.0]}
  - {avatar: female_2, start: [1.5, -3.0]}

requests:
  - Get me a coffee
  - Take me to the counter
