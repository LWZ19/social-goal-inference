# The café that `python -m sgi_habitat.make_cafe` builds: a line at the coffee counter, two people walking about.
# A scene made in Blender is used the same way: export it as .glb (docs/habitat.md, "Your own scene") and name it
# under `stage`. Positions are in the pipeline's world: Habitat's (x, z) is (x, -y) here.
stage: data/habitat/stages/cafe.glb

robot:
  x: 8.6
  y: -7.0
  face: [5.0, -2.0]

queues:
  coffee_counter:
    service_s: 20
    slots:                   # the counter's front is at y = -1.0
      - {x: 5.0, y: -1.45, face: [5.0, -0.5]}
      - {x: 5.0, y: -2.15}
      - {x: 5.0, y: -2.85}
      - {x: 5.0, y: -3.55}
      - {x: 5.0, y: -4.25}

humans:
  - {avatar: male_1, queue: coffee_counter}
  - {avatar: female_0, queue: coffee_counter}
  - {avatar: female_2, queue: coffee_counter}
  - {avatar: male_3, start: [3.5, -6.0]}
  - {avatar: female_3, start: [6.5, -5.0]}

requests:
  - Get me a coffee
  - Get me a coffee from the counter
