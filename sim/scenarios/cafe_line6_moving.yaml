# cafe_line6_moving: cafe_line6 with the line moving (research, 2026-11-01): the person at the front is served
# every 15 s, walks about for 8 to 15 s and joins the end again. The slots are extended to 9, so
# that people coming back (and the robot, once it has joined) have places behind the line.
