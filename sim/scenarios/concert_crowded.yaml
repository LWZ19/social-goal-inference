# concert_crowded: the whole front row along the barricades is taken, and more stand behind it.
# Asked for a place near the stage, the robot should take a place behind these people.
# An open ground 30 x 32 m (python -m sgi_habitat.make_room --width 30 --depth 32 --no-walls
# --floor-rgb 92 92 96 --out data/habitat/stages/concert_ground.glb), the concert stage at its north end,
# and two barricades of 8 m end to end 1.4 m in front of it. Three performers stand on the stage deck,
# 1.2 m up. Positions are in the pipeline's world: the stage's front edge is at y = -12.7.
stage: data/habitat/stages/concert_ground.glb
wander_area: [3.0, 27.0, -30.5, -24.0]       # walkers stay at the back, behind the robot's view of the front

objects:
  - {model: data/habitat/objects/concert_stage/concert_stage.glb, x: 15.0, y: -7.0, scale: 0.01}
  - {model: data/habitat/objects/barricade/barricade.glb, x: 11.0, y: -14.5}
  - {model: data/habitat/objects/barricade/barricade.glb, x: 19.0, y: -14.5}

robot:
  x: 15.0
  y: -23.5
  face: [15.0, -14.0]

humans:
  # performers, on the deck
  - {avatar: male_2, stand: [12.0, -8.5], face: [12.0, -20.0], z: 1.2}
  - {avatar: female_3, stand: [15.0, -7.5], face: [15.0, -20.0], z: 1.2}
