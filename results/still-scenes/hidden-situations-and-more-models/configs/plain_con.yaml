  floor_min_pixels: 2000
  floor_person_clearance_m: 0.4
  camera_height_min_m: 0.2
  camera_height_max_m: 3.0
  yaw_tolerance_rad: 0.001
  free_space_agreement_min: 0.9
  view_half_angle_deg: 35.0
  visible_half_angle_deg: 60.0
  floor_range_m: 12.0
  seen_depth_ratio: 0.03
  seen_depth_margin_m: 0.02
  max_keep_m: 3.0
  max_people: 40
  max_constraints: 12
  person_mark_height_m: 1.1
  candidate_count: 4
run:
  grounding: vlm
  context_check: vlm
  goal: constraints
  people: vlm
  constraints: vlm
  grounding_source: view
  heading_mode: face_target
  trials: 3
  leave_out_situation: null
  final_test: false
